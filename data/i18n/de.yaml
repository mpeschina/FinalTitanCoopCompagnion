# ------------------------------------------------------------------ draft page
draft.need_setup: "Richtet das Spiel zuerst auf der Seite Aufbau ein."
draft.title: "Draft"
draft.rules: |
  - **Erstes Spiel?** Lasst den Draft aus: Teilt stattdessen jedem Spieler {per} zufällige Titanen aus.
  - Mischt den Titanenstapel und legt **3 Titanen offen** in die Tischmitte.
  - Der **jüngste Spieler** wählt zuerst, danach geht es **nach links** weiter.
  - Wer am Zug ist, nimmt **1** der offenen Titanen und legt ihn offen vor sich.
  - Ersetzt ihn sofort vom Stapel, sodass immer 3 Titanen zur Wahl liegen.
  - Macht weiter, bis **jeder Spieler {per} Titanen** hat. Sie bilden eure Bank.
  - Ihr dürft eure Wahl miteinander absprechen.
draft.intro: "Draftet eure Titanen wie gewohnt am Tisch und klickt dann die **{need}** Titanen an, die ihr genommen habt, damit der Gegner sie nie bekommt."
draft.intro_help: "Findet jeden über die maximalen Lebenspunkte und Geschwindigkeit auf der Karte. Klickt eine markierte Karte erneut an, um die Markierung zu entfernen."
