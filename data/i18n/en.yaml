# ------------------------------------------------------------------ draft page
draft.need_setup: "Configure the game on the Setup page first."
draft.title: "Draft"
draft.rules: |
  - **First game?** Skip the draft: deal {per} random Titans to each player instead.
  - Shuffle the Titan deck and lay out **3 Titans face up** in the middle of the table.
  - The **youngest player** picks first, then play goes **to the left**.
  - On your turn, take **1** of the face-up Titans and put it face up in front of you.
  - Replace it right away from the top of the deck, so there are always 3 Titans to choose from.
  - Keep going until **every player has {per} Titans**. These form your bench.
  - You may discuss your picks with each other.
draft.intro: "Draft your Titans on the table as usual, then click the **{need}** Titans you took, so the enemy never gets them."
draft.intro_help: "Find each one by the Max Life and Speed printed on the card. Click a marked card again to unmark it."
