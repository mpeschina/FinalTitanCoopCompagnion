# Sound-effect words, thresholds, durations, and enemy taunts for the presentation layer.
words:
  damage:          # [minimum damage, word], checked top to bottom
    - [5, "KA-BOOM!"]
    - [3, "BAM!"]
    - [1, "POW!"]
  whiff: "WHIFF!"
  armor: "CLANG!"
  dodge: "SWISH!"
  minion: "NOT TODAY!"
  poison: "BLURB"
  fire: "SIZZLE!"
  charge: "ZZAP!"
  ultimate: "ULTIMATE!!"
  poof: "POOF!"
  ko: "K.O.!"
  fight: "FIGHT!"
  retreat: "RETREAT!"
  slash: "SHING!"

# Damage tier per word: drives shake, knockback, hit-stop, and particles.
