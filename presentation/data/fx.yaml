  reveal_upgrade: 900
  reveal_bench: 800
  swap: 900
  title: 2200
  reveal_arena: 2200
  vs: 2400
  ultimate: 2600
  ko: 2600
  player_lost: 2200
  retreat: 1600
  final_fight: 2000
  victory: 4000
  defeat: 4000

# Generic taunts from the enemy team; never card specific.
